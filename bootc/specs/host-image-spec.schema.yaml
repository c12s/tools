# JSON Schema (draft-07, written as YAML) for the fleet spec (fleet.yaml).
# Quasar stores it and validates every spec `cockpit image apply` sends.
# Register it once per org (schemas live per org/namespace/name/version):
#
#   cockpit create schema --org c12s --namespace default \
#     --schema-name host-image-spec --version v1.0.0 \
#     --path tools/bootc/specs/host-image-spec.schema.yaml
#
# Check a spec by hand (the same call `image apply` makes):
#
#   cockpit validate schema --org c12s --namespace default \
#     --schema-name host-image-spec --version v1.0.0 --path fleet.yaml
#
# This schema covers the shape of the file: required fields, types, formats,
# no unknown keys. Rules across the file (an image name must be defined in
# spec.images, one canary per image group, ids unique, VMs only on run_vms
# hosts) are checked by cockpit, since JSON Schema cannot express them.
$schema: "http://json-schema.org/draft-07/schema#"
title: HostImageSpec
type: object
additionalProperties: false
required: [metadata, spec]
properties:
  apiVersion:
    const: c12s/os.v1
  kind:
    const: HostImageSpec
  metadata:
    type: object
    additionalProperties: false
    required: [org]
    properties:
      org: {$ref: "#/definitions/name"}
      name: {type: string}
  spec:
    type: object
    additionalProperties: false
    required: [nodes]
    properties:
      images:
        type: object
        propertyNames: {$ref: "#/definitions/name"}
        additionalProperties: {$ref: "#/definitions/image"}
      nodes:
        type: array
        minItems: 1
        items: {$ref: "#/definitions/node"}
      rollout:
        type: object
        additionalProperties: false
        properties:
          soak: {$ref: "#/definitions/duration"}
          timeout: {$ref: "#/definitions/duration"}
          poll: {$ref: "#/definitions/duration"}
definitions:
  name:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  uuid:
    type: string
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
  digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  duration:
    description: Go duration, e.g. 90s, 1m, 1h30m
    type: string
    pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|ms|s|m|h))+$"
  image:
    type: object
    additionalProperties: false
    required: [ref]
    properties:
      ref:
        description: repo:tag, short (os/edge-base:v1.1) or with registry
        type: string
        pattern: "^[^\\s@]+(:[A-Za-z0-9_][A-Za-z0-9._-]*)?$"
      digest: {$ref: "#/definitions/digest"}
      rebootPolicy:
        enum: [immediate]
  node:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: {$ref: "#/definitions/uuid"}
      name: {type: string}
      image: {$ref: "#/definitions/name"}
      canary: {type: boolean}
      vms:
        type: array
        items: {$ref: "#/definitions/vm"}
  vm:
    type: object
    additionalProperties: false
    required: [name, disk]
    properties:
      name: {$ref: "#/definitions/name"}
      disk:
        description: artifact name on the disk registry, or a full http(s) URL
        type: string
        minLength: 1
      digest: {$ref: "#/definitions/digest"}
      vcpus: {type: integer, minimum: 1, maximum: 64}
      memoryMb: {type: integer, minimum: 256}
      image: {$ref: "#/definitions/name"}
      canary: {type: boolean}
